spring.application.name=web_flux_demo

server.port=8080
server.servlet.context-path=/webflux

r2dbc.host=localhost
r2dbc.port=5432
r2dbc.dbase=webflux
r2dbc.username=postgres
r2dbc.password=Vitalex88

callback.total.timeout.seconds=30
callback.memory.delay.seconds=2

spring.r2dbc.pool.max-size=10
spring.r2dbc.url=r2dbc:postgresql://${r2dbc.host}:${r2dbc.port}/${r2dbc.dbase}
spring.r2dbc.name=${r2dbc.username}
spring.r2dbc.password=${r2dbc.password}
spring.r2dbc.pool.enabled=true

spring.sql.init.platform=postgres
spring.sql.init.mode=always

logging.level.root=INFO
logging.level.ru.vitos.local.webflux=INFO

spring.liquibase.change-log=classpath:db/scheme-webflux-changelog.xml
spring.liquibase.url=jdbc:postgresql://${r2dbc.host}:${r2dbc.port}/${r2dbc.dbase}
spring.liquibase.user=postgres
spring.liquibase.password=Vitalex88
spring.liquibase.enabled=true